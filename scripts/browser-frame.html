<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=__WIDTH__">
<title>Browser Frame</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: __WIDTH__px;
    height: __HEIGHT__px;
    overflow: hidden;
    background: linear-gradient(160deg, #0D0E14 0%, #0A0B10 40%, #12101C 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    position: relative;
  }

  /* Subtle ambient glow behind frame */
  body::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    height: 80%;
    background: radial-gradient(ellipse, rgba(249, 115, 22, 0.06) 0%, transparent 65%);
    pointer-events: none;
  }

  .browser-frame {
    position: relative;
    z-index: 1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.5),
      0 8px 20px rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(255, 255, 255, 0.06);
  }

  .title-bar {
    height: 40px;
    background: linear-gradient(180deg, #1E1F26 0%, #1A1B22 100%);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    position: relative;
  }

  .traffic-light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .traffic-light.close { background: #FF5F57; }
  .traffic-light.minimize { background: #FFBD2E; }
  .traffic-light.maximize { background: #28C840; }

  .address-bar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.06);
    border-radius: 6px;
    padding: 4px 16px;
    font-size: 12px;
    color: #6B6B80;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 280px;
    justify-content: center;
  }

  .address-bar .lock {
    color: #28C840;
    font-size: 10px;
  }

  .screenshot-container {
    width: __INNER_WIDTH__px;
    height: __INNER_HEIGHT__px;
    overflow: hidden;
  }

  .screenshot-container img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="browser-frame">
    <div class="title-bar">
      <div class="traffic-light close"></div>
      <div class="traffic-light minimize"></div>
      <div class="traffic-light maximize"></div>
      <div class="address-bar">
        <span class="lock">&#128274;</span>
        <span>__URL__</span>
      </div>
    </div>
    <div class="screenshot-container">
      <img src="__SCREENSHOT_PATH__" alt="StdOut screenshot" />
    </div>
  </div>
</body>
</html>
