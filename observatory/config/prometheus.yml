global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mac Mini node exporter (if available)
  - job_name: 'mac-mini'
    static_configs:
      - targets: ['192.168.0.221:9100']

  # StdOut application metrics
  - job_name: 'stdout'
    static_configs:
      - targets: ['stdout:3000']
    metrics_path: '/metrics'

  # Observatory Sentinel AI
  - job_name: 'observatory-sentinel'
    static_configs:
      - targets: ['observatory-sentinel:8081']
    metrics_path: '/metrics'

  # Windlass scheduler
  - job_name: 'windlass'
    static_configs:
      - targets: ['windlass:8116']
    metrics_path: '/metrics'
