global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'stdout-observatory'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'prometheus'

  # Docker daemon metrics (optional — only if dockerd exposes :9323; down by default).
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          environment: 'production'

  # Per-container CPU/memory/disk via the cAdvisor container (same bridge network).
  # This is what the Sentinel queries for real resource metrics.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          environment: 'production'
          service: 'cadvisor'

  # StdOut application metrics
  - job_name: 'stdout'
    static_configs:
      - targets: ['stdout:3000']
        labels:
          environment: 'production'
          service: 'stdout'
          tier: 'critical'
    metrics_path: '/metrics'

  # Windlass scheduler metrics
  - job_name: 'windlass'
    static_configs:
      - targets: ['windlass:8116']
        labels:
          environment: 'production'
          service: 'windlass'
          tier: 'critical'
    metrics_path: '/metrics'

  # Observatory Sentinel AI metrics
  - job_name: 'observatory-sentinel'
    static_configs:
      - targets: ['observatory-sentinel:8081']
        labels:
          environment: 'production'
          service: 'observatory-sentinel'
          tier: 'critical'
    metrics_path: '/metrics'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          environment: 'production'
          service: 'loki'
    metrics_path: '/metrics'

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          environment: 'production'
          service: 'tempo'
    metrics_path: '/metrics'
