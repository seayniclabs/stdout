global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (configure for your environment)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['your-host-ip:9100']

  # StdOut application metrics
  - job_name: 'stdout'
    static_configs:
      - targets: ['stdout:3000']
    metrics_path: '/metrics'

  # Observatory Sentinel AI
  - job_name: 'observatory-sentinel'
    static_configs:
      - targets: ['observatory-sentinel:8081']
    metrics_path: '/metrics'

  # Windlass scheduler
  - job_name: 'windlass'
    static_configs:
      - targets: ['windlass:8116']
    metrics_path: '/metrics'
