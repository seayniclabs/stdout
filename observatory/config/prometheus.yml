global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mac Mini node exporter (if available)
  - job_name: 'mac-mini'
    static_configs:
      - targets: ['192.168.0.221:9100']
    
  # Add more targets here as needed
