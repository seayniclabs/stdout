# StdOut deployment config — multi-box / role-split provisioning.
#
# Use with:  ./install.sh --config deploy.yaml
#
# Each entry is one target host. `roles` controls what gets installed there.
# Omit `roles` (or use `full`) for a complete self-contained StdOut instance
# (stdout + windlass + observability) — this is the DEFAULT.
#
# For a distributed single instance, split roles across boxes and set
# `stdout_url` on the satellites so windlass/observability know where the
# stdout brain lives.
#
# ── Example A: two independent full-stack instances (multi-tenant) ───────────
targets:
  - host: charlie@192.168.0.244        # full stack (default)
    roles: [full]

  - host: charlie@192.168.0.250        # a second, separate instance
    roles: [full]

# ── Example B: one instance split across three boxes (uncomment to use) ──────
# targets:
#   - host: charlie@10.0.0.10
#     roles: [stdout]                  # the brain — runs the app + setup server
#   - host: charlie@10.0.0.11
#     roles: [windlass]                # watchdog on its own box
#     stdout_url: http://10.0.0.10:8112
#   - host: charlie@10.0.0.12
#     roles: [observability]           # prometheus/loki/tempo elsewhere
#     stdout_url: http://10.0.0.10:8112

# Notes:
# - Valid roles: full | stdout | windlass | observability
# - install.sh runs targets sequentially and prints each box's setup URL.
# - Prerequisite auto-install approval is asked once per run (or pass --yes).
