services:
  # StdOut Incident Companion
  stdout:
    build: .
    image: ghcr.io/seayniclabs/stdout:latest  # Pre-built image (pull if available, build if not)
    container_name: stdout
    restart: unless-stopped
    ports:
      - "8112:3000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Chicago
      - STDOUT_MODE=${STDOUT_MODE:-selfhost}
      - DB_PATH=${DB_PATH:-/data/stdout.db}
      - APP_URL=${APP_URL:-http://localhost:8112}
      - WINDLASS_URL=${WINDLASS_URL:-http://windlass:8116}
      - SENTINEL_API_URL=${SENTINEL_API_URL:-http://observatory-sentinel:8081}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OBSERVATORY_ANALYST_MODEL=${OBSERVATORY_ANALYST_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      - OBSERVATORY_WATCHER_MODEL=${OBSERVATORY_WATCHER_MODEL:-llama3.2:3b-instruct-q4_K_M}
    secrets:
      - secret_key
      - anthropic_api_key
      - resend_api_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # depends_on:
    #   windlass:
    #     condition: service_healthy
    networks:
      - stdout-net

  # Windlass Scheduler
  windlass:
    image: ghcr.io/seayniclabs/windlass:latest
    container_name: windlass
    restart: unless-stopped
    ports:
      - "8116:8116"
    volumes:
      - ./windlass-config:/opt/windlass
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Chicago
      - WINDLASS_CONFIG=/opt/windlass
      - WINDLASS_INTERVAL=300
      - STDOUT_URL=http://stdout:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8116/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stdout-net

  # Observatory Sentinel AI
  # Note: The Observatory UI is part of the StdOut web app at /app/observatory
  # This service provides the backend AI agents and observability stack
  observatory-sentinel:
    build: ./observatory/sentinel
    container_name: observatory-sentinel
    restart: unless-stopped
    ports:
      - "${SENTINEL_API_PORT:-8081}:8081"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - TEMPO_URL=http://tempo:3200
      - WATCHER_MODEL=${WATCHER_MODEL:-llama3.2:3b-instruct-q4_K_M}
      - ANALYST_MODEL=${ANALYST_MODEL:-qwen2.5:14b-instruct-q4_K_M}
      - CRITICAL_CHECK_INTERVAL=${CRITICAL_CHECK_INTERVAL:-300}
      - PRODUCT_CHECK_INTERVAL=${PRODUCT_CHECK_INTERVAL:-600}
      - DEFAULT_CHECK_INTERVAL=${DEFAULT_CHECK_INTERVAL:-3600}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - HELMSMAN_API_URL=${HELMSMAN_API_URL:-}
    profiles:
      - observatory
    networks:
      - stdout-net
    depends_on:
      - prometheus
      - loki
      - tempo

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observatory/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    profiles:
      - observatory
    networks:
      - stdout-net

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observatory/config/loki-config.yml:/etc/loki/config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    profiles:
      - observatory
    networks:
      - stdout-net

  # Tempo - Distributed Tracing
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - "3200:3200"  # HTTP
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - ./observatory/config/tempo-config.yml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    command:
      - '-config.file=/etc/tempo.yaml'
    profiles:
      - observatory
    networks:
      - stdout-net

  # Packet Capture & Analysis
  observatory-pcap:
    image: nicolaka/netshoot:latest
    container_name: observatory-pcap
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./observatory/captures:/captures
    command: >
      sh -c "
        mkdir -p /captures &&
        while true; do
          tcpdump -i any -w /captures/capture_$(date +%Y%m%d_%H%M%S).pcap -G 3600 -W 24 -Z root 'not port 22'
        done
      "
    profiles:
      - observatory

volumes:
  prometheus-data:
  loki-data:
  tempo-data:

networks:
  stdout-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24

secrets:
  secret_key:
    file: ./secrets/stdout_secret_key
  anthropic_api_key:
    file: ./secrets/stdout_anthropic_api_key
  resend_api_key:
    file: ./secrets/stdout_resend_api_key
