services:
  stdout:
    image: ghcr.io/seayniclabs/stdout:latest
    container_name: stdout
    restart: unless-stopped
    ports:
      - "8112:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Chicago
      - STDOUT_MODE=selfhost
      - DB_PATH=/data/stdout.db
      - APP_URL=http://localhost:8112
      - WINDLASS_URL=http://windlass:8116
      # - SECRET_KEY=<generate-32-char-random>
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - RESEND_API_KEY=re_...
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      windlass:
        condition: service_healthy
    networks:
      - stdout-net

  windlass:
    image: ghcr.io/seayniclabs/windlass:latest
    container_name: windlass
    restart: unless-stopped
    ports:
      - "8116:8116"
    volumes:
      - ./windlass-config:/opt/windlass
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Chicago
      - WINDLASS_CONFIG=/opt/windlass
      - WINDLASS_INTERVAL=300
      - STDOUT_URL=http://stdout:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8116/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stdout-net

networks:
  stdout-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
