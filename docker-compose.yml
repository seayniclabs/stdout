services:
  stdout:
    image: ghcr.io/seayniclabs/stdout:latest
    container_name: stdout
    restart: unless-stopped
    ports:
      - "8112:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Chicago
      - STDOUT_MODE=selfhost
      - DB_PATH=/data/stdout.db
      # Optional: add your own AI keys for diagnostics (BYOK)
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - OPENAI_API_KEY=sk-...
      # Optional: email notifications
      # - RESEND_API_KEY=re_...
      # Optional: connect to Windlass engine (if running separately)
      # - WINDLASS_URL=http://host.docker.internal:8116
    networks:
      - stdout-net

  # -------------------------------------------------------------------------
  # Windlass (optional) — schedule-aware Docker service manager
  #
  # Windlass is a separate component. You do NOT need it to use StdOut.
  # Add it if you want to automatically start/stop Docker Compose stacks
  # on a schedule and have StdOut monitor them with schedule-aware alerting.
  #
  # To start StdOut + Windlass together:
  #   docker compose --profile windlass up -d
  #
  # To start StdOut only:
  #   docker compose up -d
  #
  # After starting Windlass, go to StdOut → Windlass → enter
  # http://host.docker.internal:8116 → Connect → Sync.
  # -------------------------------------------------------------------------
  windlass:
    profiles: [windlass]
    image: ghcr.io/seayniclabs/windlass:latest
    container_name: windlass
    restart: unless-stopped
    ports:
      - "8116:8116"
    volumes:
      # Your schedule.yaml and state live here
      - /opt/windlass:/opt/windlass
      # Docker socket — required so Windlass can start/stop containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount your compose directories so Windlass can manage them
      # Add one line per compose stack in your schedule.yaml, e.g.:
      # - /opt/containers:/opt/containers
    environment:
      - TZ=America/Chicago
      - WINDLASS_CONFIG=/opt/windlass
      - WINDLASS_INTERVAL=300
    networks:
      - stdout-net

networks:
  stdout-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
