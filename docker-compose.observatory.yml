# StdOut — two-network production compose.
#
# Security design (vault: Projects/StdOut/Decision — Host Networking and Satellites.md):
#   - HOST network: stdout + windlass (must see/scan the LAN; windlass watches stdout).
#   - INTERNAL bridge (no LAN exposure): the Observatory stack + AI toolbox.
#   - Docker forbids a host-net container from also joining a bridge, so the few endpoints
#     stdout needs are published LOOPBACK-ONLY (127.0.0.1) — reachable by stdout (host net) at
#     localhost:<port>, never from the LAN. Internal-only tools publish nothing.
#
# Deploy: docker compose -f docker-compose.observatory.yml up -d
services:
  # ── LAN-facing (host network) ─────────────────────────────────────────────
  stdout:
    image: charlieseay/stdout:latest
    container_name: stdout
    network_mode: host
    environment:
      - TZ=America/Chicago
      - PORT=8112
      - DB_PATH=/data/stdout.db
      - NODE_ENV=production
      - STDOUT_MODE=selfhost
      - APP_URL=http://stdout.local:8112
      # host-net peers via localhost; internal services via loopback-published ports
      - WINDLASS_URL=http://localhost:8116
      - OLLAMA_URL=http://localhost:11434
      - SENTINEL_API_URL=http://localhost:8081
      - PROMETHEUS_URL=http://localhost:9090
      - LOKI_URL=http://localhost:3100
      - TEMPO_URL=http://localhost:3200
      - CADVISOR_URL=http://localhost:8181
      - TRIVY_URL=http://localhost:4954
      # Suricata EVE ingest (keystone security signal → Windlass IP-block / service-restart).
      # File-tail defaults to the shared suricata-logs volume (idle until --profile suricata writes eve.json).
      # Redis list: SURICATA_REDIS_MODE=list (default) + SURICATA_REDIS_KEY.
      # Redis stream: SURICATA_REDIS_MODE=stream + SURICATA_REDIS_STREAM/GROUP (XREADGROUP, short BLOCK).
      # Prior lesson: keep SURICATA_REDIS_BLOCK_MS short (2s) and loop — long XREADGROUP hangs agents.
      - SURICATA_EVE_PATH=${SURICATA_EVE_PATH:-/var/log/suricata/eve.json}
      - SURICATA_REDIS_URL=${SURICATA_REDIS_URL:-}
      - SURICATA_REDIS_MODE=${SURICATA_REDIS_MODE:-list}
      - SURICATA_REDIS_KEY=${SURICATA_REDIS_KEY:-suricata}
      - SURICATA_REDIS_STREAM=${SURICATA_REDIS_STREAM:-eve_alerts}
      - SURICATA_REDIS_GROUP=${SURICATA_REDIS_GROUP:-stream}
      - SURICATA_REDIS_CONSUMER=${SURICATA_REDIS_CONSUMER:-stdout-1}
      - SURICATA_REDIS_BLOCK_MS=${SURICATA_REDIS_BLOCK_MS:-2000}
      - SURICATA_AUTO_FIX=${SURICATA_AUTO_FIX:-true}
      - SURICATA_CORRELATE_WINDOW_SEC=${SURICATA_CORRELATE_WINDOW_SEC:-300}
      - SURICATA_CORRELATE_THRESHOLD=${SURICATA_CORRELATE_THRESHOLD:-3}
      - SURICATA_WINDLASS_RETRIES=${SURICATA_WINDLASS_RETRIES:-3}
      # Optional Windlass API token (vault: stdout/windlass → /etc/stdout/windlass.token).
      - WINDLASS_TOKEN=${WINDLASS_TOKEN:-}
      - WINDLASS_TOKEN_PATH=${WINDLASS_TOKEN_PATH:-/etc/stdout/windlass.token}
      # Surface the full Observatory init brief (incl. Phase 4.5 data-source/baseline config) in logs.
      - DEBUG_OBSERVATORY=${DEBUG_OBSERVATORY:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-test@stdout.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-test-password-123}
    volumes:
      - stdout-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - suricata-logs:/var/log/suricata:ro
      # Optional token file: bind-mount host /etc/stdout/windlass.token (vault: stdout/windlass)
      # - /etc/stdout/windlass.token:/etc/stdout/windlass.token:ro
    # Override the image's baked-in :3000 healthcheck — the app listens on PORT=8112 here.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8112/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  windlass:
    image: charlieseay/windlass:latest
    container_name: windlass
    network_mode: host
    # NET_ADMIN required for Suricata-driven IP blocks (iptables DROP).
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=America/Chicago
      - STDOUT_URL=http://localhost:8112   # windlass watches stdout
      - WINDLASS_IP_BLOCK_TTL=${WINDLASS_IP_BLOCK_TTL:-3600}
      # Optional Bearer auth for /v1/block-ip, /v1/restart-service, /anomaly.json (vault: stdout/windlass).
      - WINDLASS_TOKEN=${WINDLASS_TOKEN:-}
      - WINDLASS_TOKEN_PATH=${WINDLASS_TOKEN_PATH:-/etc/stdout/windlass.token}
    volumes:
      - windlass-data:/data
      # RW socket required for Suricata-driven service restart (and schedule start/stop).
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional token file (same path StdOut reads):
      # - /etc/stdout/windlass.token:/etc/stdout/windlass.token:ro
    restart: unless-stopped

  # ── Internal-only Observatory stack (no LAN exposure) ─────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"   # loopback-only: stdout reaches it, LAN cannot
    # Reach host-net StdOut (:8112) for suricata-stdout scrape (Linux needs host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observatory/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - stdout-egress

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    # Use the image's baked-in local-config.yaml (avoids host file bind-mount
    # issues on some Docker Desktop setups). Override with a custom image or
    # config volume when a non-default schema is required.
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - stdout-egress

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observatory/config/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command:
      - '-config.file=/etc/tempo.yaml'
    networks:
      - stdout-egress

  # ── AI toolbox (P7, tier-1) — internal-only, invokable by the brain ────────
  # Container & system intelligence
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8080"   # per-container metrics; loopback-only
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - stdout-egress

  # Container vulnerability scanning — Trivy server mode (brain queries it).
  # NOTE: Trivy must reach the internet to update its CVE database, so it is on a normal
  # (non-internal) bridge. It is still LOOPBACK-published (127.0.0.1) — not exposed to the LAN.
  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports:
      - "127.0.0.1:4954:4954"
    volumes:
      - trivy-cache:/root/.cache
    networks:
      - stdout-egress

  # Network/diagnostic CLI toolbox — tshark/tcpdump/dig/etc. available for the AI to exec into.
  # Stays running; the brain runs tools via `docker exec observatory-tools <cmd>`.
  observatory-tools:
    image: nicolaka/netshoot:latest
    container_name: observatory-tools
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["sleep", "infinity"]
    # Reaches the other Observatory services by name and can run external diagnostics
    # (dig/curl). Not published anywhere — only the brain execs into it.
    networks:
      - stdout-egress

  # Packet capture stays on HOST net — it must see real LAN traffic for tshark/zeek analysis.
  observatory-pcap:
    image: nicolaka/netshoot:latest
    container_name: observatory-pcap
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - pcap-captures:/captures
    command: >
      sh -c "mkdir -p /captures &&
        while true; do
          tcpdump -i any -w /captures/capture.pcap -G 3600 -W 24 -Z root 'not port 22' || sleep 10;
        done"

  # ── P7b tier-2 tools ───────────────────────────────────────────────────────
  # Zeek — deep network analysis. Runs BATCH over the pcaps that observatory-pcap writes
  # (read-only on captured traffic — no live-tap privilege needed), producing
  # conn/dns/http/ssl/notice logs. StdOut ingests those via POST /app/api/zeek/ingest
  # (or ?pull=1 / ?analyze=1) for correlation + anomaly baselines. Stays on the internal
  # bridge; it only touches files, not the wire.
  zeek:
    image: zeek/zeek:latest
    container_name: zeek
    restart: unless-stopped
    volumes:
      - pcap-captures:/captures:ro
      - zeek-logs:/logs
    # Idle by default; the brain triggers an analysis run via:
    #   docker exec zeek sh -c "cd /logs && zeek -r /captures/capture.pcap"
    command: ["sleep", "infinity"]
    networks:
      - stdout-egress

  # Suricata (IDS) — keystone security signal. HOST net + NET_RAW to see LAN traffic.
  # EVE JSON alerts are tailed by StdOut (SURICATA_EVE_PATH) and correlated into
  # Windlass IP-block / service-restart actions via POST /anomaly.json
  # (or POST /v1/block-ip and POST /v1/restart-service).
  # Enable:
  #   docker compose -f docker-compose.observatory.yml --profile suricata up -d
  # Redis stream alternative:
  #   SURICATA_REDIS_URL=redis://127.0.0.1:6379/0 SURICATA_REDIS_MODE=stream
  #   (creates consumer group: XGROUP CREATE eve_alerts stream 0 MKSTREAM)
  suricata:
    build:
      context: ./observatory/suricata-runtime
      dockerfile: Dockerfile
    image: stdout-suricata:local
    container_name: suricata
    profiles: ["suricata"]
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - suricata-logs:/var/log/suricata
    environment:
      - SURICATA_IFACE=${SURICATA_IFACE:-any}
      # false on production Linux hosts with a real NIC (e.g. eth0).
      - SURICATA_SIM_FALLBACK=${SURICATA_SIM_FALLBACK:-true}
      - SURICATA_SIM_INTERVAL_SEC=${SURICATA_SIM_INTERVAL_SEC:-120}

  # Redis 6.2+ for optional Suricata EVE stream ingest (XREADGROUP on eve_alerts/stream).
  # StdOut file-tails eve.json by default; enable stream mode with:
  #   SURICATA_REDIS_URL=redis://127.0.0.1:6379/0 SURICATA_REDIS_MODE=stream
  # Bootstrap: redis-cli --eval observatory/config/redis-stream-config.lua
  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["suricata"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stdout-egress

  # Optional: eve.json → Redis stream (XADD) when StdOut uses SURICATA_REDIS_MODE=stream.
  # File-tail (SURICATA_EVE_PATH) remains the default ingest path.
  eve-redis-bridge:
    build:
      context: ./observatory/suricata-runtime
      dockerfile: Dockerfile.bridge
    image: stdout-eve-redis-bridge:local
    container_name: eve-redis-bridge
    profiles: ["suricata"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - suricata-logs:/var/log/suricata:ro
    environment:
      - EVE_PATH=/var/log/suricata/eve.json
      - REDIS_URL=redis://redis:6379/0
      - REDIS_STREAM=${SURICATA_REDIS_STREAM:-eve_alerts}
    networks:
      - stdout-egress

  # ntopng — live traffic flow UI/metrics. Loopback-only if enabled (never on the LAN).
  # Uncomment to activate:
  # ntopng:
  #   image: ntop/ntopng:latest
  #   container_name: ntopng
  #   restart: unless-stopped
  #   network_mode: host
  #   command: ["--community", "-i", "any", "-w", "127.0.0.1:3333"]

  # Falco — runtime kernel/syscall threat detection. Needs privileged + kernel headers / eBPF;
  # host-specific, so left as documented opt-in rather than a default.
  # Uncomment to activate (requires host kernel support):
  # falco:
  #   image: falcosecurity/falco:latest
  #   container_name: falco
  #   restart: unless-stopped
  #   privileged: true
  #   volumes:
  #     - /var/run/docker.sock:/host/var/run/docker.sock
  #     - /dev:/host/dev
  #     - /proc:/host/proc:ro

volumes:
  stdout-data:
  windlass-data:
  prometheus-data:
  loki-data:
  tempo-data:
  trivy-cache:
  pcap-captures:
  zeek-logs:
  suricata-logs:

networks:
  # Internal Observatory bridge. NOT a Docker `internal:true` network — that would block BOTH
  # outbound (Trivy CVE DB) AND host port-publishing (StdOut on host net reaches these via
  # 127.0.0.1). Instead this is a normal bridge whose services publish LOOPBACK-ONLY
  # (127.0.0.1:<port>), so they are reachable by StdOut on the host but NEVER bound to the LAN.
  # Verified: curl from the LAN IP to these ports is refused; the brain reaches them at localhost.
  stdout-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
